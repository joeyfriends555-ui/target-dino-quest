<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07100a">
<title>DINO QUEST - LOST WORLD ADVENTURE</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#020704;color:#ead8a7;font-family:Georgia,"Yu Mincho","Hiragino Mincho ProN",serif}
button,select,input{font:inherit}
button{cursor:pointer}
:root{--gold:#c99935;--line:#6d501c;--panel:#07100a;--red:#7d1f10;--green:#315d08}
.app{max-width:1536px;margin:auto;min-height:100vh;background:
radial-gradient(circle at 20% 0,rgba(56,76,45,.22),transparent 35%),#020704}
.main{display:grid;grid-template-columns:25% 42% 33%;gap:6px;padding:8px}
.panel{border:1px solid var(--line);background:linear-gradient(rgba(7,16,10,.97),rgba(3,9,5,.99));min-width:0}
.left{padding:7px}
.logo{height:205px;border:1px solid var(--line);background:#09110b;display:flex;align-items:center;justify-content:center;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.nav{margin-top:7px}
.nav button{width:100%;height:65px;margin-bottom:7px;text-align:left;padding:8px 16px;border:1px solid var(--line);background:#0b120d;color:#e5c16d;font-weight:700;font-size:18px}
.nav button.active{background:linear-gradient(#9a2b18,#6c1b0e);color:#fff1c6}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.stat{border:1px solid var(--line);padding:12px;background:#07100a;min-height:105px}
.stat b{display:block;font-size:32px;color:#f0c35d;margin-top:8px}
.center{padding:8px;position:relative}
.centerHead{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:6px 2px 12px}
.centerHead h2{margin:0;color:#f0c35d;font-size:21px}
.centerHead select{background:#11180f;color:#f0c35d;border:1px solid var(--line);padding:8px}
.stageGrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;height:745px;overflow:auto;padding-right:2px}
.stage{position:relative;height:118px;border:1px solid var(--line);background:#09110b;color:#ead8a7;padding:0;overflow:hidden;text-align:left}
.stage.selected{outline:2px solid #e2a91f;box-shadow:0 0 14px rgba(225,169,31,.45)}
.stage img{position:absolute;left:0;top:0;width:100%;height:78px;object-fit:contain;object-position:center;background:linear-gradient(#405362,#20372b 58%,#07100a);padding:3px}
.stage .txt{position:absolute;left:6px;right:6px;bottom:4px;z-index:2;text-shadow:0 1px 2px #000}
.stage .txt strong{display:block;color:#f2cc75;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage .txt small{font-size:9px;color:#d8c594}
.start{width:100%;height:48px;margin-top:7px;border:1px solid #b16922;background:linear-gradient(#a43218,#7b1e10);color:#fff0c3;font-size:18px;font-weight:700}
.right{padding:8px}
.topPills{display:flex;justify-content:flex-end;gap:8px;margin-bottom:7px}
.pill{border:1px solid var(--line);border-radius:18px;padding:7px 12px;background:#0b120d;color:#f0c35d}
.heroTitle{border:1px solid var(--line);border-bottom:0;padding:10px 12px;color:#f0c35d;font-weight:700;font-size:20px}
.hero{height:310px;position:relative;border:1px solid var(--line);overflow:hidden;background:linear-gradient(#415361,#20372b 60%,#07100a)}
.hero img{width:100%;height:100%;object-fit:contain;object-position:center;padding:12px;filter:drop-shadow(0 10px 8px rgba(0,0,0,.65))}
.heroLatin{position:absolute;left:12px;bottom:8px;color:#f1d69a;text-shadow:0 2px 3px #000}
.facts{border:1px solid var(--line);border-top:0;padding:8px 12px;background:#07100a}
.fact{display:grid;grid-template-columns:80px 1fr;gap:8px;padding:5px 0;border-bottom:1px solid #2d2517;font-size:14px}
.fact b{color:#e4b653}
.choose{width:calc(100% - 24px);margin:12px;height:58px;border:1px solid #b6a13a;background:linear-gradient(#4e7f0a,#315705);color:#fff2c2;font-size:22px}
.today{border:1px solid var(--line);margin-top:8px}
.todayHead{display:flex;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--line);color:#e4b653}
.todayHead button{background:#16170e;border:1px solid var(--line);color:#e6c46f}
.todayGrid{display:grid;grid-template-columns:repeat(3,1fr)}
.todayCell{text-align:center;padding:10px;border-right:1px solid #3c301a}
.todayCell:last-child{border-right:0}
.todayCell b{display:block;font-size:24px;color:#f0c35d}
.modes{margin:0 8px 8px;border:1px solid var(--line);padding:10px}
.modes h3{margin:0 0 10px;color:#f0c35d}
.modeGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mode{height:140px;background:#0c120d;border:1px solid var(--line);color:#f0c35d;font-weight:700;font-size:18px}
.mode span{display:block;font-size:32px;margin-bottom:8px}
.mode small{display:block;color:#cbb98c;font-size:11px;margin-top:7px}
.bottom{display:grid;grid-template-columns:repeat(6,1fr);margin:0 8px 8px}
.bottom button{height:55px;background:#0b120d;color:#e3bd65;border:1px solid var(--line)}
.bottom button.active{background:#8f2515;color:#fff}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:50;align-items:center;justify-content:center;padding:12px}
.overlay.show{display:flex}
.modal{width:min(1250px,96vw);max-height:94vh;overflow:auto;border:2px solid var(--line);background:#050b07;color:#ead8a7;padding:14px}
.modalHead{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px}
.close{background:#15150d;border:1px solid var(--line);color:#e9c66f;padding:8px 14px}
.quiz{background:url("parchment.jpg") center/cover;color:#23180c;border:2px solid #7b581f;padding:28px;margin-top:15px;text-align:center;min-height:280px;display:flex;flex-direction:column;justify-content:center}
.quizWord{font-size:clamp(38px,6vw,72px);line-height:1.05;overflow-wrap:anywhere}
.quizMeaning{font-size:clamp(24px,3vw,38px);margin-top:18px}
.options{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.options button{min-height:60px;border:1px solid var(--line);background:#0c120d;color:#f0d7a1;padding:10px}
.options button.correct{background:#376d0a}
.options button.wrong{background:#8a2515}
.dinoDetail{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.dinoDetail img{width:100%;height:520px;object-fit:contain;object-position:center;background:linear-gradient(#405362,#20372b 60%,#07100a);padding:12px;border:1px solid var(--line)}
.stage .badge{position:absolute;right:3px;top:3px;background:#152213e8;border:1px solid var(--gold);font-size:10px;padding:2px;color:#fff0bc}
.progressTrack{height:7px;background:#2b2919;border-radius:8px;overflow:hidden;margin:5px 0}.progressTrack i{display:block;height:100%;background:#b88b26}
.feedback{margin-top:12px;padding:12px;border:1px solid var(--line);color:#f6d995}.feedback.ok{border-color:#6c9b27}.feedback.ng{border-color:#a3442d}
.feedback button{padding:10px 18px;background:#315d08;color:#fff2c2;border:1px solid var(--line);margin-top:8px}
.settingsRow{margin:12px 0;padding:12px;border:1px solid var(--line)}
.detailFacts .fact{font-size:17px;padding:10px 0}
.records{width:100%;border-collapse:collapse;margin-top:10px}
.records th,.records td{border:1px solid #4c3a1b;padding:6px}
@media(max-width:1100px){.main{grid-template-columns:1fr}.stageGrid{grid-template-columns:repeat(4,1fr);height:560px}.modeGrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.stageGrid{grid-template-columns:repeat(2,1fr)}.dinoDetail{grid-template-columns:1fr}.bottom{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="app">
<div class="main">
  <aside class="panel left">
    <div class="logo"><img src="logo.jpg" alt="DINO QUEST"></div>
    <div class="nav">
      <button class="active" data-nav="home">✥　今日の学習<small>　恐竜を選んで冒険に出発！</small></button>
      <button data-nav="dex">▣　恐竜図鑑</button>
      <button data-nav="records">▥　成績・記録</button>
      <button data-nav="ach">🏆　実績コレクション</button>
      <button data-nav="settings">⚙　設定</button>
    </div>
    <div class="stats">
      <div class="stat">今日の進捗<b id="todayProgress">0 / 50</b></div>
      <div class="stat">今日選択中の恐竜<b id="leftDino" style="font-size:18px">コエロフィシス</b><small id="leftRange"></small></div>
    </div>
  </aside>

  <main class="panel center">
    <div class="centerHead">
      <h2>✥ 冒険する恐竜を選択してください</h2>
      <select id="eraFilter">
        <option value="all">全時代</option>
        <option value="三畳紀">三畳紀</option>
        <option value="ジュラ紀">ジュラ紀</option>
        <option value="白亜紀">白亜紀</option>
      </select>
    </div>
    <div class="stageGrid" id="stageGrid"></div>
    <button class="start" id="startAdventure">🦖 この恐竜で冒険を始める！</button>
  </main>

  <section class="panel right">
    <div class="topPills">
      <span class="pill">📅 <b id="streak">0</b>日</span>
      <span class="pill">⚡ <b id="xp">0</b> XP</span>
      <span class="pill">🏆 Lv.<b id="level">1</b></span>
    </div>
    <div class="heroTitle"><span id="heroStage">STAGE 1</span>　<span id="heroName">コエロフィシス</span></div>
    <div class="hero"><img id="heroImg" src="dino-01.webp" alt=""><div class="heroLatin" id="heroLatin"></div></div>
    <div class="facts" id="heroFacts"></div>
    <button class="choose" id="heroChoose">この恐竜を選択</button>
    <div class="today">
      <div class="todayHead"><span>今日の学習データ</span><button id="resetToday">リセット</button></div>
      <div class="todayGrid">
        <div class="todayCell">✓ 覚えた<b id="todayCorrect">0</b></div>
        <div class="todayCell">✕ 間違えた<b id="todayWrong">0</b></div>
        <div class="todayCell">↻ パス<b id="todayPass">0</b></div>
      </div>
    </div>
  </section>
</div>

<section class="modes">
<h3>✥ 学習モードを選択</h3>
<div class="modeGrid">
<button class="mode" data-mode="flash"><span>🃏</span>単語カード<small>自己判定で定着</small></button>
<button class="mode" data-mode="choice"><span>⚔️</span>4択バトル<small>英語 → 意味</small></button>
<button class="mode" data-mode="typing"><span>⌨️</span>スペル挑戦<small>日本語 → 英語</small></button>
<button class="mode" data-mode="sentence"><span>💬</span>短文クエスト<small>穴埋め・日本語訳</small></button>
<button class="mode" data-mode="weak"><span>☠️</span>弱点ハント<small>誤答語を優先</small></button>
</div>
</section>

<nav class="bottom">
<button class="active" data-nav="home">⌂ ホーム</button>
<button data-nav="daily">✥ 今日の学習</button>
<button data-nav="dex">▣ 恐竜図鑑</button>
<button data-nav="records">▥ 成績・記録</button>
<button data-nav="ach">🏆 実績</button>
<button data-nav="settings">⚙ 設定</button>
</nav>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

function mark(w,type,mode){
 const x=S.words[w.n]||(S.words[w.n]={correct:0,wrong:0,pass:0,modes:{}});x.modes=x.modes||{};
 const y=x.modes[mode]||(x.modes[mode]={correct:0,wrong:0,pass:0});
 const field=type==='ok'?'correct':type==='ng'?'wrong':'pass';x[field]++;y[field]++;S.today[field]++;
 if(type==='ok')S.xp+=5;
 if(!S.today.seen.includes(w.n)&&S.today.seen.length<50)S.today.seen.push(w.n);
 if(S.lastStudyDate!==todayKey()){
  const previous=new Date(S.lastStudyDate+'T12:00:00');const current=new Date(todayKey()+'T12:00:00');
  S.streak=Number.isFinite(previous.getTime())&&Math.round((current-previous)/86400000)===1?(S.streak||0)+1:1;S.lastStudyDate=todayKey();
 }
 S.history.unshift({at:new Date().toISOString(),number:w.n,word:w.w,stage:S.selected,mode,result:field});S.history=S.history.slice(0,5000);
 save();updateUI();
}

function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function startMode(mode){

 Q={list:shuffle(list),i:0,mode,answered:false};renderQ();
}

 show(`<h2>成績・記録</h2><p>学習履歴 ${S.history.length}件　・　Stage ${S.selected}：${stageCount(S.selected)}/50（${stageLevel(S.selected)}）</p><table class="records"><tr><th>No.</th><th>単語</th><th>意味</th><th>○</th><th>×</th><th>Pass</th></tr>${rows.map(r=>{const w=WORDS[r.n-1];return `<tr><td>${r.n}</td><td>${esc(w?.w)}</td><td>${esc(w?.m)}</td><td>${r.correct||0}</td><td>${r.wrong||0}</td><td>${r.pass||0}</td></tr>`}).join('')}</table><h3>最近の回答</h3><p>${S.history.slice(0,20).map(h=>`${esc(h.at.slice(0,10))}　No.${h.number} ${esc(h.word)}　${esc(h.mode)}　${esc(h.result)}`).join('<br>')||'まだ記録がありません。'}</p>`);
}
function achievements(){const completed=DINOS.filter(d=>stageCount(d.stage)===50).length,started=DINOS.filter(d=>stageCount(d.stage)>0).length;show(`<h2>実績</h2><div class="quiz"><div class="quizMeaning">XP ${S.xp} / Lv.${level()}</div><div class="quizMeaning">学習済み ${Object.values(S.words).filter(x=>x.correct>0).length} / 1700語</div><div class="quizMeaning">図鑑発見 ${started}/34　・　Complete ${completed}/34</div><div class="quizMeaning">連続学習 ${S.streak}日</div></div>`)}
function settings(){show(`<h2>設定</h2><div class="settingsRow"><label><input type="checkbox" id="hideMastered" ${S.settings.hideMastered?'checked':''}> 同じモードで5回正解した単語を通常出題から外す</label></div><div class="options"><button id="rToday">今日の学習をリセット</button><button id="rStage">選択ステージをリセット</button><button id="rAll">全データをリセット</button></div>`);$('#hideMastered').onchange=e=>{S.settings.hideMastered=e.target.checked;save()};$('#rToday').onclick=resetToday;$('#rStage').onclick=resetStage;$('#rAll').onclick=resetAll}
function resetToday(){S.today=blankToday();save();updateUI();hide()}
function resetStage(){for(const w of wordsFor(S.selected))delete S.words[w.n];S.history=S.history.filter(h=>h.stage!==S.selected);save();updateUI();hide()}
function resetAll(){S=fresh();save();updateUI();hide()}
function nav(which){$$('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===which));if(which==='home'){hide();return}if(which==='daily')startMode('choice');if(which==='dex')showDex();if(which==='records')records();if(which==='ach')achievements();if(which==='settings')settings()}
document.addEventListener('DOMContentLoaded',()=>{
 $('#eraFilter').onchange=renderStages;$('#startAdventure').onclick=()=>startMode('choice');$('#heroChoose').onclick=()=>startMode('choice');$('#resetToday').onclick=resetToday;
 $$('[data-mode]').forEach(b=>b.onclick=()=>startMode(b.dataset.mode));$$('[data-nav]').forEach(b=>b.onclick=()=>nav(b.dataset.nav));updateUI();
 if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('service-worker.js').catch(()=>{});
});
</script>
</body></html>
